<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1600" viewBox="0 0 1740 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087fff"/></marker></defs><rect width="1740" height="1600" fill="#f4f9ff"/><text x="40" y="52" font-family="Arial" font-size="34" fill="#101a44">Lesson 27 · Predict → trace → verify permissions</text><rect x="20" y="90" width="300" height="80" rx="16" fill="#087fff"/><text x="170" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Student UI</text><path d="M170 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="370" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="520" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">TypeScript host</text><path d="M520 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="720" y="90" width="300" height="80" rx="16" fill="#00a977"/><text x="870" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">SDK pipeline</text><path d="M870 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1070" y="90" width="300" height="80" rx="16" fill="#8838ff"/><text x="1220" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Host callback</text><path d="M1220 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><rect x="1420" y="90" width="300" height="80" rx="16" fill="#ee5425"/><text x="1570" y="139" text-anchor="middle" font-family="Arial" font-size="27" fill="white">Lab files</text><path d="M1570 170 V1550" stroke="#aec6df" stroke-dasharray="8 7"/><text x="180" y="227" fill="#142d53" font-family="Arial" font-size="24">1. Validate the prediction and experiment</text><path d="M170 245 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="325" fill="#142d53" font-family="Arial" font-size="24">2. Prepare a disposable workspace</text><path d="M520 343 H1570" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="423" fill="#142d53" font-family="Arial" font-size="24">3. Configure scoped rules and mode</text><path d="M520 441 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="521" fill="#142d53" font-family="Arial" font-size="24">4. Guard the exact classroom operation</text><path d="M520 539 h65 v24 h-65" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="619" fill="#142d53" font-family="Arial" font-size="24">5. Record the PreToolUse decision</text><path d="M870 637 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="717" fill="#142d53" font-family="Arial" font-size="24">6. Keep deny stronger than bypass</text><path d="M870 735 h65 v24 h-65" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="880" y="815" fill="#142d53" font-family="Arial" font-size="24">7. Force the ask-rule callback</text><path d="M870 833 H1220" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="913" fill="#142d53" font-family="Arial" font-size="24">8. Start the real model query</text><path d="M520 931 H870" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1011" fill="#142d53" font-family="Arial" font-size="24">9. Capture actual tool requests</text><path d="M870 1029 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="1109" fill="#142d53" font-family="Arial" font-size="24">10. Capture native denial feedback</text><path d="M870 1127 H170" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1207" fill="#142d53" font-family="Arial" font-size="24">11. Observe successful completion</text><path d="M870 1225 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="530" y="1305" fill="#142d53" font-family="Arial" font-size="24">12. Verify files independently</text><path d="M1570 1323 H520" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/><text x="180" y="1403" fill="#142d53" font-family="Arial" font-size="24">13. Render prediction feedback</text><path d="M520 1421 H170" stroke="#087fff" stroke-width="3" marker-end="url(#arrow)"/></svg>